[package]
name = "fasttalk-model-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
ed25519-dalek = "3.0.0"
fs2 = "0.4.3"
futures-util = "0.3.31"
hex = "0.4.3"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["fs", "io-util"] }
url = "2.5.7"

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
