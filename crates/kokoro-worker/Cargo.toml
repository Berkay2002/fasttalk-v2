[package]
name = "fasttalk-kokoro-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.4"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
sherpa-onnx = "1.13.4"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tokio-stream = "0.1.17"
