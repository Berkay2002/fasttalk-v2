[package]
name = "fasttalk-pipeline"
version = "0.1.0"
edition = "2024"

[dependencies]
fasttalk-conversation = { path = "../conversation" }
futures-util = { version = "0.3.31", features = ["sink"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream"] }
rubato = { version = "0.16.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = "0.30.0"
tokio-util = "0.7.19"
